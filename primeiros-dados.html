<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Primeiros dados | Decorize</title>
<link rel="icon" href="assets/icone.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<style>
  .caixa-seed { max-width: 520px; margin: 40px auto; padding: 24px; border-radius: 20px; background: #fff; box-shadow: var(--sombra); display: grid; gap: 12px; }
  .log { font-size: 14px; white-space: pre-line; color: var(--suave); font-weight: 700; }
</style>
</head>
<body class="adm">
<!-- Ferramenta da TF Solutions: copia os temas, categorias, kits e textos de exemplo para o Firebase,
     para o catálogo não ficar vazio. Só funciona para quem está na lista "admins".
     Não apaga nem substitui nada que já exista. -->
<div class="caixa-seed">
  <h1 style="font-size:22px">Primeiros dados do catálogo</h1>
  <p>Copia para o Firebase os <b>temas, categorias, kits, adicionais e textos</b> da demonstração. Coleção que já tiver dados é pulada (nada é apagado). Agenda, contatos e peças de exemplo <b>não</b> são copiados.</p>
  <label class="campo"><span>E-mail</span><input type="email" id="email" autocomplete="username"></label>
  <label class="campo"><span>Senha</span><input type="password" id="senha" autocomplete="current-password"></label>
  <button class="btn btn-laranja" id="copiar">Entrar e copiar os dados</button>
  <p class="log" id="log"></p>
  <a class="link" href="admin.html">Ir para o painel</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="dados.js"></script>
<script>
(function () {
  const log = (t) => { document.getElementById("log").textContent += t + "\n"; };
  document.getElementById("copiar").addEventListener("click", async (e) => {
    e.target.disabled = true;
    document.getElementById("log").textContent = "";
    if (MODO_DEMO) { log("O Firebase não está configurado em dados.js."); return; }
    try {
      await Dados.entrar(document.getElementById("email").value.trim(), document.getElementById("senha").value);
      log("✅ Entrou.");
    } catch (err) {
      log(err && err.message === "sem-acesso" ? "❌ Este e-mail não está na lista admins." : "❌ E-mail ou senha incorretos.");
      e.target.disabled = false; return;
    }
    const grupos = [
      ["categorias", SEED_CATEGORIAS], ["combos", SEED_COMBOS],
      ["adicionais", SEED_ADICIONAIS], ["temas", SEED_TEMAS],
    ];
    try {
      for (const [col, lista] of grupos) {
        if ((await Dados.listar(col)).length) { log(`⏭️ ${col}: já tem dados, pulei.`); continue; }
        for (const item of lista) await Dados.salvar(col, item.id, item);
        log(`✅ ${col}: ${lista.length} copiados.`);
      }
      const geral = {}, privado = {};
      Object.entries(SEED_CONFIG).forEach(([k, v]) => { if (v === null || v === undefined) return; (CAMPOS_PRIVADOS.includes(k) ? privado : geral)[k] = v; });
      if (await Dados.obter("configuracoes", "geral")) log("⏭️ configurações: já existem, pulei.");
      else { await Dados.salvar("configuracoes", "geral", geral); await Dados.salvar("configuracoes", "privado", privado); log("✅ configurações copiadas (dados do contrato no documento privado)."); }
      log("\nPronto! Abra o catálogo para conferir.");
    } catch (err) {
      console.error(err);
      log("❌ Erro ao gravar: confira se as regras do regras.md foram publicadas.\n" + (err.message || err));
    }
    e.target.disabled = false;
  });
})();
</script>
</body>
</html>
